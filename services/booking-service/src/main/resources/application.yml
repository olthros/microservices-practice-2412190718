server:
  port: 8083

spring:
  application:
    name: booking-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: PERSONAL_GROUP
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 2000
            logger-level: basic
    loadbalancer:
      retry:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
