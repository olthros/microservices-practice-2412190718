spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false
  datasource:
    url: jdbc:h2:mem:user_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update

app:
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef0123456789abcdef
    issuer: user-service
    ttl-minutes: 120
